version: 2

models:

  - name: int_order_items_enriched

    description: >
      Enriched order-item level data combining product
      information with transaction details.
      One row per order item.

  - name: int_orders_enriched

    description: >
      Order-level data enriched with customer attributes.
      One row per order.

  - name: int_customer_orders

    description: >
      Order-level customer analytics model containing
      revenue, cost, profit, customer order sequence,
      and order type.
      One row per order.