version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension containing customer attributes.
      One row per customer.

    columns:

      - name: customer_id
        description: Unique identifier for the customer.

        data_tests:
          - unique
          - not_null

  - name: dim_products
    description: >
      Product dimension containing product attributes.
      One row per product.

    columns:

      - name: product_id
        description: Unique identifier for the product.

        data_tests:
          - unique
          - not_null

      - name: product_name
        description: Name of the product.

        data_tests:
          - not_null

      - name: category
        description: Product category.

        data_tests:
          - not_null

  - name: dim_date
    description: >
      Calendar dimension used for time-based analysis.
      One row per calendar date.

  - name: fct_orders
    description: >
      Order-level fact table.
      One row per order.

    columns:

      - name: order_id
        description: Unique identifier for the order.

        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer who placed the order.

        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

        data_tests:
          - not_null

      - name: order_date
        description: Date the order was placed.

        data_tests:
          - not_null

      - name: order_status
        description: Current status of the order.

        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pending
                  - completed
                  - cancelled
                  - refunded

        data_tests:
          - not_null

      - name: order_revenue
        description: Revenue generated by the order.

        data_tests:
          - not_null

  - name: fct_order_items
    description: >
      Order-item-level fact table containing product-level
      transaction metrics.
      One row per order item.

  - name: customer_metrics
    description: >
      Customer-level analytical metrics including order count,
      revenue, profit, and repeat purchasing behavior.
      One row per customer.