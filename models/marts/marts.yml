version: 2

models:

  - name: dim_customers
    description: >
      Customer dimension containing customer attributes
      and customer-level lifetime metrics.
      One row per customer.

  - name: dim_products
    description: >
      Product dimension containing product attributes.
      One row per product.

  - name: dim_date
    description: >
      Calendar dimension used for time-based analysis.
      One row per calendar date.

  - name: fct_orders
    description: >
      Order-level fact table containing order metrics.
      One row per order.

      columns:

      - name: order_id
        description: Unique identifier for the order.

      - name: customer_id
        description: Identifier of the customer who placed the order.

      - name: order_date
        description: Date the order was placed.

      - name: order_status
        description: Current status of the order.

      - name: order_revenue
        description: Total revenue generated by the order.

      - name: order_cost
        description: Total product cost associated with the order.

      - name: order_gross_profit
        description: Revenue minus product cost.

      - name: customer_order_number
        description: Sequential order number for the customer.

      - name: order_type
        description: Indicates whether the order was a new or repeat purchase.

  - name: fct_order_items
    description: >
      Order-item-level fact table containing product-level
      transaction metrics.
      One row per order item.

  - name: customer_metrics
    description: >
      Customer-level analytical metrics including order count,
      revenue, profit, and repeat purchasing behavior.
      One row per customer.